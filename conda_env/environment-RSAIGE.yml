name: RSAIGE
channels:
- conda-forge
- bioconda
- r
- defaults
dependencies:
# Build tools and system dependencies
- cmake
- make
- git
- python=3.10
- pip

# C++ and compilation dependencies (cross-platform)
- compilers
- libopenblas
- tbb-devel

# R and core R packages
- r-base>=4.0
- r-recommended

# Core R dependencies for SAIGE-QTL Dynamic
- r-rcpp
- r-rcppparallel
- r-rcpparmadillo
- r-rcppeigen
- r-rcppnumerical
- r-bh
- r-matrix
- r-data.table
- r-optparse
- r-mass
- r-nlme

# Statistical packages
- r-skat
- r-rhpcblasctl
- r-rsqlite
- r-spatest

# Additional packages for package building
- r-remotes
- r-devtools
- r-r.utils

# Python dependencies for cget
- pip:
  - cget

