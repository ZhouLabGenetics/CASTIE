[workspace]
channels = ["conda-forge", "bioconda"]
name = "CASTIE"
platforms = [
  { platform = "linux-64", linux = "3.10.0", glibc = "2.17" },
  "osx-64",
]
version = "0.3.2"

[tasks]
install-github-deps = "Rscript -e 'if(!require(remotes)) install.packages(\"remotes\"); remotes::install_github(c(\"cysouw/qlcMatrix\", \"barkasn/fastSave\"))'"
build = { cmd = "R CMD INSTALL .", depends-on = ["install-github-deps"] }
test = { cmd = "Rscript -e 'library(CASTIE); cat(\"SAIGE-QTL loaded successfully\\n\")'", depends-on = ["build"] }

[dependencies]
# System dependencies
python = "3.11.*"
polars = "*"
boost-cpp = "*"
cget = "*"
openblas = "*"
zlib = "*"
zstd = "*"
savvy = "*"
superlu = "*"
zlib-ng = "*"
nomkl = "*"
llvm-openmp = "*"
tbb = "*"
tbb-devel = "*"
cxx-compiler = "*"
make = "*"
libblas = { version = "*", build = "*openblas" }
liblapack = { version = "*", build = "*openblas" }

# R and core packages
r-base = ">=4.0"
r-devtools = "*"

# Core R computational packages
r-rcpp = "*"
r-rcpparmadillo = "*"
r-rcppeigen = "*"
r-rcppparallel = "*"
r-rcppnumerical = "*"
r-bh = "*"
r-cpp11 = "*"

# Data manipulation and I/O
"r-data.table" = "*"
r-dplyr = "*"
r-dbplyr = "*"
r-matrix = "*"
r-furrr = "*"
r-hdf5r = ">=1.3.12,<2"
r-arrow = "*"   # Parquet output support for step2

# Standard R packages
r-nlme = "*"
r-mass = "*"

# Statistical packages
r-skat = "*"
r-metaskat = "*"
r-spatest = "*"

# Utility packages
r-optparse = "*"
r-rhpcblasctl = "*"
r-rsqlite = "*"
r-remotes = "*"
htslib = ">=1.22.1,<2"
r-qlcmatrix = ">=0.9.9,<0.10"

# Note: Some packages not available in conda channels:
# - qlcMatrix (GitHub: cysouw/qlcMatrix)
# - MetaSKAT (GitHub: leeshawn/MetaSKAT)
# - fastSave (GitHub: barkasn/fastSave)
# These are handled via the install-github-deps task
